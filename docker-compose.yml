services:
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # ollama = native /api; openai = /v1/chat/completions (vLLM, TGI, Ollama's own /v1).
      # The URL must match: .../11434 for ollama, .../11434/v1 for openai.
      GATEWAY_BACKEND: "ollama"
      GATEWAY_BACKEND_URL: "http://host.docker.internal:11434"
      GATEWAY_DEFAULT_MODEL: "llama3.2:1b"
      GATEWAY_MAX_CONCURRENT_REQUESTS: "4"
      GATEWAY_TRACING_ENABLED: "true"
      GATEWAY_OTLP_ENDPOINT: "http://jaeger:4317"
      # Per-tier backends: "kind:model", kind in ollama|openai|bedrock. A bare model
      # name uses GATEWAY_BACKEND as its kind. Unset means every tier resolves to the
      # local default, which is how this ships — nothing in automatic routing can
      # reach a paid backend unless you set one of these.
      #
      # GATEWAY_TIER_FAST: "ollama:llama3.2:1b"
      # GATEWAY_TIER_POWERFUL: "bedrock:<model-id>"
      # GATEWAY_AWS_REGION: "us-east-1"
      #
      # Credentials come from the standard AWS chain and must never be written here.
      # To give the container the host's credentials, mount them read-only and point
      # the SDK at them, or pass a role's env vars in from your shell:
      #   volumes:
      #     - ~/.aws:/home/app/.aws:ro
      #   environment:
      #     AWS_PROFILE: "${AWS_PROFILE}"
      #     AWS_REGION: "${AWS_REGION}"
      # .env is gitignored; keep keys out of this file and out of the image.
    networks:
      - stack
    restart: unless-stopped
    depends_on:
      - jaeger

  loki:
    image: grafana/loki:3.2.0
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki/loki.yml:/etc/loki/loki.yml:ro
    command: -config.file=/etc/loki/loki.yml
    networks:
      - stack
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.2.0
    volumes:
      - ./observability/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/promtail.yml
    networks:
      - stack
    restart: unless-stopped
    depends_on:
      - loki

  # Docker creates a named volume root-owned, but Jaeger runs as uid 10001, so badger
  # cannot create its directories. This one-shot fixes ownership and exits.
  jaeger-init:
    image: busybox:1.36
    command: sh -c "mkdir -p /badger/key /badger/data && chown -R 10001:0 /badger && chmod -R 775 /badger"
    volumes:
      - jaeger_data:/badger
    networks:
      - stack
    restart: "no"

  jaeger:
    image: jaegertracing/all-in-one:latest
    depends_on:
      jaeger-init:
        condition: service_completed_successfully
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC receiver
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      # all-in-one defaults to in-memory storage, which loses every trace when the
      # container is replaced. Badger persists to the volume below, so a benchmark
      # run's traces survive the next run.
      SPAN_STORAGE_TYPE: badger
      BADGER_EPHEMERAL: "false"
      BADGER_DIRECTORY_VALUE: /badger/data
      BADGER_DIRECTORY_KEY: /badger/key
    volumes:
      - jaeger_data:/badger
    networks:
      - stack
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.0
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    # admin API enables the snapshot and delete_series endpoints, so a run's data can
    # be exported and the series cleared without destroying the volume.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
      - --web.enable-admin-api
    networks:
      - stack
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - stack
    restart: unless-stopped

networks:
  stack:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
  jaeger_data:
