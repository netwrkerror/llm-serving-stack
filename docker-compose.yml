services:
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # ollama = native /api; openai = /v1/chat/completions (vLLM, TGI, Ollama's own /v1).
      # The URL must match: .../11434 for ollama, .../11434/v1 for openai.
      GATEWAY_BACKEND: "ollama"
      GATEWAY_BACKEND_URL: "http://host.docker.internal:11434"
      GATEWAY_DEFAULT_MODEL: "llama3.2:1b"
      GATEWAY_MAX_CONCURRENT_REQUESTS: "4"
      GATEWAY_TRACING_ENABLED: "true"
      GATEWAY_OTLP_ENDPOINT: "http://jaeger:4317"
    networks:
      - stack
    restart: unless-stopped
    depends_on:
      - jaeger

  loki:
    image: grafana/loki:3.2.0
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki/loki.yml:/etc/loki/loki.yml:ro
    command: -config.file=/etc/loki/loki.yml
    networks:
      - stack
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.2.0
    volumes:
      - ./observability/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/promtail.yml
    networks:
      - stack
    restart: unless-stopped
    depends_on:
      - loki

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC receiver
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - stack
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.0
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - stack
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - stack
    restart: unless-stopped

networks:
  stack:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
